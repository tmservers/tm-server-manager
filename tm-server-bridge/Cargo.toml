[package]
name = "tm-server-bridge"
publish = false

version.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
tokio.workspace = true

spacetimedb-sdk.workspace = true
tm-server-controller.workspace = true
tm-server-types.workspace = true
tm-server-manager-api-rs.workspace = true

dotenvy.workspace = true

#takumi.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true

serde = { workspace = true, features = ['derive'] }

nadeo-api.workspace = true

# This is needed because openssl is an implicit dependency.
# If we want to compile for docker musl we need to statically link
# against it and otherwise it wont be found.
openssl = { workspace = true, optional = true }


[dev-dependencies]
testcontainers = { workspace = true, features = ["blocking"] }
#insta.workspace = true

[features]
tracing = []
# Required for docker build to vendor openssl
docker = ["dep:openssl"]
