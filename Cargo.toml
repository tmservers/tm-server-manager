[workspace]
members = [
    "gbx-rs",
    "tm-server-bridge",
    "tm-server-controller",
    "tm-server-types",
    "tm-server-manager",
    "tm-server-manager-api-rs",
    "tm-mode-driver/core",
    "tm-mode-driver/sdk",
    "tm-mode-driver/sim",
    "tm-mode-driver/manialinks",
    "tm-mode-driver/modes/*",
]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
authors = ["kistz (Kilian Strunz)"]
keywords = ["trackmania", "nadeo", "gbxremote", "gbx", "api", "xml-rpc"]
categories = [
    "api-bindings",
    "network-programming",
    "asynchronous",
    "trackmania",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tmservers/tm-server-manager"
edition = "2024"


[workspace.dependencies]
#==================
# Util Dependencies
#==================
#takumi = "0"
dotenvy = "0.15"
tokio = { features = ["full"], version = "1" }
base64 = { version = "*" }
dxr = "0.8"
json = { package = "simd-json", version = "0.17" }
serde = { version = "1" }
serde_json = "1.0.154"
uuid = { version = "1.12", features = ["serde"] }
thiserror = "2"
bytes = "1"
flate2 = "1.0"
minilzo-rs = "0"
gbx-header = "0"
log = "0.4"
tachyonix = "*"
dashmap = "*"
nadeo-api = "*"
# Optional in the bridge, which needs it to link statically against it in docker builds.
openssl = { version = "0.10", features = ["vendored"] }
# This can be removed if we actualy have higher-ranked trait bounds for AsyncFnMuts Output type which is a supertrait of AsyncFn which is needed for event propagation in the trackmania server. 
async_fn_traits = "*"
petgraph = { version = "0.8.3", features = ['all'] }

mlua = { version = "0.12", features = ["luau"] }
#chumsky = { version = "1.0.0-alpha.8" }

#========
# Tracing
#========
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.31"

#=====
# Wasm
#=====
wasmtime = { version = "50.0.0", default-features = false, features = [
    "runtime",
    "cranelift",
    "component-model",
    "std",
] }
wit-component = "0.262.0"
wit-bindgen = "0.63.0"

#============
# SpacetimeDB
#============
spacetimedb = { version = "2.11.0", features = [
    "unstable",
], git = "https://github.com/kistz/SpacetimeDB.git", branch = "fork-changes-args" }
spacetimedb-lib = { version = "2.11.0", git = "https://github.com/kistz/SpacetimeDB.git", branch = "fork-changes-args" }
spacetimedb-sdk = { version = "2.11.0", git = "https://github.com/kistz/SpacetimeDB.git", branch = "fork-changes-args" }


#==============
# Worspace Deps
#==============
gbx-rs = { path = "./gbx-rs" }
tm-server-manager-api-rs = { path = "./tm-server-manager-api-rs", version = "0.1.0-dev" }
tm-server-types = { path = "./tm-server-types", version = "0.1.0-dev" }
tm-server-controller = { path = "./tm-server-controller", version = "0.1.0-dev" }
tm-mode-driver-sdk = { path = "./tm-mode-driver/sdk" }
tm-mode-driver-manialinks = { path = "./tm-mode-driver/manialinks" }
tm-mode-driver = { path = "./tm-mode-driver/core" }
tm-mode-driver-sim = { path = "./tm-mode-driver/sim" }


#=======
#Testing
#=======

# The bridge adds the blocking feature for its sync runner.
testcontainers = "0"
insta = { version = "1", features = ["yaml"] }

# The wasm of the driver modes: `cargo build --profile mode --target wasm32-unknown-unknown`.
# Its own profile so the manager module and the natives keep `release`.
[profile.mode]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
