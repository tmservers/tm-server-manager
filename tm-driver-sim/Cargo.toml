[package]
name = "tm-driver-sim"
description = "Deterministic simulation of a Trackmania server to test the wasm driver and its modes."
publish = false

version.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
tm-wasm-driver.workspace = true
tm-server-types.workspace = true
serde.workspace = true
serde_json.workspace = true
# Names the compiled modes the driver engine returns.
wasmtime.workspace = true

# Natively, for the settings of the modes their checks follow.
tm-driver-mode-rounds.workspace = true
tm-driver-mode-time-attack.workspace = true
tm-driver-mode-reverse-cup.workspace = true
tm-driver-mode-knockout.workspace = true

[dev-dependencies]
insta = { workspace = true, features = ["glob"] }
