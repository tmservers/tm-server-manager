[package]
name = "tm-server-controller"
description = "Call methods on and receive events from a trackmania server through XML-RPC"
readme = "README.md"
publish = true

version.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
tm-server-types = { workspace = true, features = ["serde"] }

tokio = { workspace = true, features = ["full"] }
tachyonix.workspace = true
bytes.workspace = true

serde = { workspace = true, features = ["derive"] }
async_fn_traits.workspace = true

dxr.workspace = true
base64.workspace = true

dashmap.workspace = true

thiserror.workspace = true

tracing = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
testcontainers.workspace = true

[features]
default = ["tracing"]
tracing = ["dep:tracing", "dep:opentelemetry"]
