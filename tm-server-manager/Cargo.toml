[package]
name = "tm-server-manager"
publish = false

version.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true


[lib]
crate-type = ["cdylib"]

[dependencies]
log = "0.4"
spacetimedb = { workspace = true }
tm-server-types = { path = "../tm-server-types", features = ["spacetime"] }
gbx-header = "0"

serde = { workspace = true, features = ["derive"] }
json.workspace = true

#gbx-rs.workspace = true
base64.workspace = true
petgraph.workspace = true
# Scripts of leaderboard steps and modes, a module has no clock or imports to give it.
# Integers are i32 like the values of the entries, which also halves the size of every value on wasm32.
rhai = { workspace = true, features = [
    "std",
    "no_time",
    "no_module",
    "no_float",
    "no_custom_syntax",
    "no_optimize",
    "only_i32",
] }
#mlua.workspace = true

[dev-dependencies]
spacetimedb = { workspace = true, features = ["test-utils"] }
# temporal_rs 0.1.2, which the test datastore pulls in through v8, does not compile against icu 2.2 and newer.
icu_calendar = "~2.1"


[features]
production = []
